spring.application.name=discovery-service

# Disabling service work as Eureka Client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

eureka.client.serviceUrl.defaultZone=http://localhost:13013/eureka/
# means :-   "I should contact the Eureka Server at port 13013."

# Q. What If above property -  eureka.client.serviceUrl.defaultZone  not configured ?
# Ans :-  Eureka Client uses its default http://localhost:8761/eureka/
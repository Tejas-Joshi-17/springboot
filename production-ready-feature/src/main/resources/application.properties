spring.application.name=production-ready-feature

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/production-read-feature?allowPublicKeyRetrieval=true&autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.connection-timeout=3000
spring.datasource.maximum-pool-size=100
spring.datasource.minimum-idel=10
spring.datasource.pool-name=ServiceConnPool
spring.datasource.connection-test-query="select 1"

# Hibernate (optional, if using JPA)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Running '.sql' file while start project
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql

# External Client Base URL
employeeService.base.url=https://9c3deb1b-bfc2-4486-a165-4e9254ce6771.mock.pstmn.io
management.endpoints.web.exposure.include=*